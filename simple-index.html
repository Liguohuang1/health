<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>痴呆风险预测与个体化血压管理</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .iphone-frame {
            width: 430px;
            height: 932px;
            background: #1a1a1a;
            border-radius: 50px;
            padding: 8px;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
            position: relative;
            margin: 0 auto;
        }
        
        .iphone-screen {
            width: 100%;
            height: 100%;
            background: #000;
            border-radius: 42px;
            overflow: hidden;
            position: relative;
        }
        
        .notch {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 30px;
            background: #000;
            border-radius: 0 0 20px 20px;
            z-index: 10;
        }
        
        .tab-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 100px;
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding-bottom: 20px;
        }
        
        .tab-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 8px 12px;
            border-radius: 12px;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .tab-item.active {
            background: #2563EB;
            color: white;
        }
        
        .tab-item i {
            font-size: 20px;
        }
        
        .tab-item span {
            font-size: 12px;
            font-weight: 500;
        }
        
        .iframe-container {
            width: 100%;
            height: calc(100% - 100px);
            border: none;
        }
        
        .content-area {
            width: 100%;
            height: calc(100% - 100px);
            background: #f3f4f6;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .welcome-card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 300px;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen flex items-center justify-center p-4">
    <!-- iPhone 15 Pro 机框 -->
    <div class="iphone-frame">
        <div class="iphone-screen">
            <!-- 刘海 -->
            <div class="notch"></div>
            
            <!-- 主内容区域 -->
            <div id="contentArea" class="content-area">
                <div class="welcome-card">
                    <div class="w-16 h-16 bg-blue-100 rounded-full flex items-center justify-center mx-auto mb-4">
                        <i class="fas fa-brain text-3xl text-blue-600"></i>
                    </div>
                    <h1 class="text-2xl font-bold text-gray-800 mb-2">智能健康管理</h1>
                    <p class="text-gray-600 mb-4">痴呆风险预测与个体化血压管理</p>
                    <div class="space-y-2 text-sm text-gray-500">
                        <div>• 基于AI的智能风险预测</div>
                        <div>• 个性化血压管理</div>
                        <div>• 强化降压适宜性评估</div>
                        <div>• 24小时健康监测</div>
                    </div>
                </div>
            </div>
            
            <!-- 底部导航栏 -->
            <div class="tab-bar">
                <div class="tab-item active" onclick="loadPage('home')">
                    <i class="fas fa-house"></i>
                    <span>首页</span>
                </div>
                <div class="tab-item" onclick="loadPage('risk')">
                    <i class="fas fa-chart-pie"></i>
                    <span>风险</span>
                </div>
                <div class="tab-item" onclick="loadPage('bp')">
                    <i class="fas fa-heart-pulse"></i>
                    <span>血压</span>
                </div>
                <div class="tab-item" onclick="loadPage('treatment')">
                    <i class="fas fa-sliders"></i>
                    <span>适宜性</span>
                </div>
                <div class="tab-item" onclick="loadPage('chat')">
                    <i class="fas fa-comments"></i>
                    <span>聊天</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 页面加载函数
        function loadPage(page) {
            // 更新活动标签
            document.querySelectorAll('.tab-item').forEach(tab => {
                tab.classList.remove('active');
            });
            event.target.closest('.tab-item').classList.add('active');
            
            // 显示对应内容
            const contentArea = document.getElementById('contentArea');
            const pages = {
                'home': `
                    <div class="welcome-card">
                        <div class="w-16 h-16 bg-blue-100 rounded-full flex items-center justify-center mx-auto mb-4">
                            <i class="fas fa-brain text-3xl text-blue-600"></i>
                        </div>
                        <h1 class="text-2xl font-bold text-gray-800 mb-2">智能健康管理</h1>
                        <p class="text-gray-600 mb-4">痴呆风险预测与个体化血压管理</p>
                        <div class="space-y-2 text-sm text-gray-500">
                            <div>• 基于AI的智能风险预测</div>
                            <div>• 个性化血压管理</div>
                            <div>• 强化降压适宜性评估</div>
                            <div>• 24小时健康监测</div>
                        </div>
                    </div>
                `,
                'risk': `
                    <div class="welcome-card">
                        <div class="w-16 h-16 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-4">
                            <i class="fas fa-chart-pie text-3xl text-red-600"></i>
                        </div>
                        <h1 class="text-2xl font-bold text-gray-800 mb-2">痴呆风险预测</h1>
                        <p class="text-gray-600 mb-4">基于多维度数据分析</p>
                        <div class="grid grid-cols-2 gap-4 mt-4">
                            <div class="text-center">
                                <div class="text-2xl font-bold text-red-600">12%</div>
                                <div class="text-sm text-gray-600">1年风险</div>
                            </div>
                            <div class="text-center">
                                <div class="text-2xl font-bold text-orange-600">36%</div>
                                <div class="text-sm text-gray-600">5年风险</div>
                            </div>
                        </div>
                    </div>
                `,
                'bp': `
                    <div class="welcome-card">
                        <div class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4">
                            <i class="fas fa-heart-pulse text-3xl text-green-600"></i>
                        </div>
                        <h1 class="text-2xl font-bold text-gray-800 mb-2">血压管理</h1>
                        <p class="text-gray-600 mb-4">个性化血压目标与监测</p>
                        <div class="bg-green-50 rounded-lg p-4 mt-4">
                            <div class="text-center">
                                <div class="text-lg font-bold text-green-700">118-128/68-74</div>
                                <div class="text-sm text-green-600">目标血压区间 (mmHg)</div>
                            </div>
                        </div>
                    </div>
                `,
                'treatment': `
                    <div class="welcome-card">
                        <div class="w-16 h-16 bg-purple-100 rounded-full flex items-center justify-center mx-auto mb-4">
                            <i class="fas fa-sliders text-3xl text-purple-600"></i>
                        </div>
                        <h1 class="text-2xl font-bold text-gray-800 mb-2">强化降压适宜性</h1>
                        <p class="text-gray-600 mb-4">个体化治疗效应评估</p>
                        <div class="bg-purple-50 rounded-lg p-4 mt-4">
                            <div class="text-center">
                                <div class="text-lg font-bold text-purple-700">高获益</div>
                                <div class="text-sm text-purple-600">基于ITE分析</div>
                            </div>
                        </div>
                    </div>
                `,
                'chat': `
                    <div class="welcome-card">
                        <div class="w-16 h-16 bg-orange-100 rounded-full flex items-center justify-center mx-auto mb-4">
                            <i class="fas fa-comments text-3xl text-orange-600"></i>
                        </div>
                        <h1 class="text-2xl font-bold text-gray-800 mb-2">智能问答</h1>
                        <p class="text-gray-600 mb-4">AI健康助手24小时在线</p>
                        <div class="space-y-2 text-sm text-gray-500 mt-4">
                            <div>• 痴呆风险相关问题</div>
                            <div>• 血压管理建议</div>
                            <div>• 治疗适宜性咨询</div>
                            <div>• 健康监测指导</div>
                        </div>
                    </div>
                `
            };
            
            contentArea.innerHTML = pages[page] || pages['home'];
        }
        
        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            console.log('痴呆风险预测与个体化血压管理 App 已加载');
        });
    </script>
</body>
</html>
